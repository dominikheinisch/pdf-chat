# Caps for every service, so heavy work (PDF ingestion, embeddings) can't starve the
# host. New services must merge it: `<<: *resource-limits`. `make` derives the
# defaults from the host (70% of RAM, all cores but two); .env can override them.
x-resource-limits: &resource-limits
  mem_limit: ${APP_MEM_LIMIT:-${AUTO_MEM_LIMIT:-8g}}
  # Same as mem_limit: no swap, since swapping is what freezes the host.
  memswap_limit: ${APP_MEM_LIMIT:-${AUTO_MEM_LIMIT:-8g}}
  cpus: ${APP_CPUS:-${AUTO_CPUS:-4}}
  # Doesn't limit usage: if the whole host runs out of memory, the kernel kills
  # this before the desktop or stateful services.
  oom_score_adj: 500

services:
  app:
    <<: *resource-limits
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Python as PID 1 ignores SIGTERM; an init process makes watch restarts instant.
    init: true
    # Loopback only: the UI isn't reachable from other machines on the network.
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    # Secrets (see .env.example); optional so test/lint/shell run without it.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://chainlit:chainlit@db:5432/chainlit
    volumes:
      # Attachments: uploaded PDFs and Sources panels, served back on resume.
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  db:
    <<: *resource-limits
    # Last to be killed if the host runs out of memory: losing an in-flight upload
    # beats killing Postgres mid-write.
    oom_score_adj: -500
    image: pgvector/pgvector:pg18
    # Dev-only credentials: no port is published, so only the app can reach it.
    environment:
      POSTGRES_USER: chainlit
      POSTGRES_PASSWORD: chainlit
      POSTGRES_DB: chainlit
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql, not .../data.
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlit -d chainlit"]
      interval: 2s
      retries: 15

volumes:
  db-data:
  attachments:
