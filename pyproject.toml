[project]
name = "pdf-chat"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "asyncpg>=0.32.0",
    "chainlit>=2.12.0",
    "fastembed>=0.9.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = ["integration: needs the Postgres database (make test-integration)"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
